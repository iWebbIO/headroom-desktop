name: Release Windows

# Builds and publishes the Windows NSIS installer (_x64-setup.exe) and signature.
# Can be run manually to create a full release (with latest.json updater manifest)
# or a download-only prerelease.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Plain X.Y.Z version to build and publish (e.g. 0.9.16)"
        required: true
        default: "0.9.16"
      publish:
        description: '"release" (full release with latest.json updater manifest) or "prerelease" (download-only installer)'
        required: false
        type: choice
        options: [release, prerelease]
        default: release

concurrency:
  group: windows-download-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  windows:
    name: Windows x64 (download only)
    runs-on: windows-latest
    timeout-minutes: 45

    env:
      # The stable endpoint on purpose: a fresh install of this build polls the
      # normal manifest, reads an older version there, and gets a clean no-op
      # (tauri only offers strictly-newer) until the converging release lands.
      HEADROOM_UPDATER_ENDPOINTS: '["https://github.com/${{ github.repository }}/releases/latest/download/latest.json"]'
      HEADROOM_UPDATER_STAGING_ENDPOINTS: '["https://github.com/${{ github.repository }}/releases/download/staging-rolling/latest.json"]'
      HEADROOM_UPDATER_PUBLIC_KEY: ${{ vars.HEADROOM_UPDATER_PUBLIC_KEY }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      HEADROOM_ACCOUNT_API_BASE_URL: ${{ vars.HEADROOM_ACCOUNT_API_BASE_URL }}
      HEADROOM_APTABASE_APP_KEY: ${{ vars.HEADROOM_APTABASE_APP_KEY }}
      VITE_HEADROOM_SALES_CONTACT_URL: ${{ vars.VITE_HEADROOM_SALES_CONTACT_URL }}
      VITE_HEADROOM_CONTACT_FORM_URL: ${{ vars.VITE_HEADROOM_CONTACT_FORM_URL }}
      HEADROOM_SENTRY_DSN: ${{ secrets.HEADROOM_SENTRY_DSN }}
      VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate target version
        id: guard
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="${VERSION#v}"

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Download-only releases use a plain X.Y.Z version (got: ${version}). Pre-release versions ship via the staging workflow." >&2
            exit 1
          fi

          tag="v${version}"

          # Never touch a release that stable installs already trust: clobbering
          # its installer would break every updater whose latest.json holds a
          # signature for the old bytes.
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq .isPrerelease 2>/dev/null | grep -qx false; then
            echo "${tag} is already a published (non-prerelease) release. Refusing to replace its assets." >&2
            exit 1
          fi

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target

      - name: Apply the version in-tree
        shell: bash
        run: ./scripts/bump-version.sh "${{ steps.guard.outputs.version }}"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build NSIS installer
        shell: bash
        run: npx tauri build --target x86_64-pc-windows-msvc --bundles nsis

      - name: Publish the installer
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.guard.outputs.tag }}
          PUBLISH_MODE: ${{ inputs.publish || 'release' }}
        run: |
          set -euo pipefail
          bundle_dir="src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis"
          setup="$(ls "$bundle_dir"/*-setup.exe)"
          sig="${setup}.sig"
          [ -f "$sig" ] || { echo "updater signature missing: $sig" >&2; exit 1; }

          prerelease_arg=""
          if [ "$PUBLISH_MODE" = "prerelease" ]; then
            prerelease_arg="--prerelease"
          fi

          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Headroom $TAG" \
              --notes "Release of Headroom $TAG for Windows." \
              $prerelease_arg \
              --target "$GITHUB_SHA"
          fi

          gh release upload "$TAG" "$setup" "$sig" --clobber --repo "$GITHUB_REPOSITORY"

          if [ "$PUBLISH_MODE" = "release" ]; then
            # Generate Windows updater manifest
            jq -n \
              --arg version "${{ steps.guard.outputs.version }}" \
              --arg notes "Headroom ${{ steps.guard.outputs.version }} (Windows)" \
              --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              --arg signature "$(cat "$sig")" \
              --arg url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/$(basename "$setup")" \
              '{version: $version, notes: $notes, pub_date: $pub_date,
                platforms: {"windows-x86_64": {signature: $signature, url: $url}}}' \
              > latest.json
            gh release upload "$TAG" latest.json --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease=false --latest
            echo "Successfully published $TAG as latest release with updater manifest."
          fi

      - name: Verify the stable channel status
        if: inputs.publish == 'prerelease'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.guard.outputs.tag }}
        run: |
          set -euo pipefail
          latest_tag="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name 2>/dev/null || true)"
          if [[ -n "$latest_tag" ]] && [[ "$latest_tag" == "$TAG" ]]; then
            echo "${TAG} became releases/latest, which would strand every platform's update check." >&2
            exit 1
          fi
          echo "Verified prerelease status for $TAG."
