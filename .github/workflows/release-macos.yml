name: Release App

# Release workflow supporting Windows, Linux, and macOS.
# Platforms can be selected individually or together via workflow_dispatch.
# macOS build is completely decoupled and will never block or run when Windows/Linux are chosen.

on:
  push:
    branches:
      - main
    paths:
      - package.json
      - src-tauri/tauri.conf.json
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Platforms to build: "windows", "linux", "windows,linux", "macos", or "all"'
        required: false
        default: "windows,linux"
      publish:
        description: '"stable" flips the release to latest; "download-only" leaves it a prerelease'
        required: false
        type: choice
        options: [stable, download-only]
        default: stable

concurrency:
  group: release-app-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  init_release:
    name: Initialize Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      should_release: ${{ steps.release_guard.outputs.should_release }}
      package_version: ${{ steps.release_guard.outputs.package_version }}
      build_macos: ${{ steps.release_guard.outputs.build_macos }}
      build_windows: ${{ steps.release_guard.outputs.build_windows }}
      build_linux: ${{ steps.release_guard.outputs.build_linux }}
      release_publish: ${{ steps.release_guard.outputs.release_publish }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate release version state
        id: release_guard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(node -p "require('./package.json').version")"
          tauri_version="$(node -p "JSON.parse(require('fs').readFileSync('./src-tauri/tauri.conf.json', 'utf8')).version")"
          expected_tag="v${package_version}"
          should_release=true

          if [[ "$package_version" != "$tauri_version" ]]; then
            echo "package.json version ($package_version) does not match src-tauri/tauri.conf.json version ($tauri_version)." >&2
            exit 1
          fi

          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            before_sha="${{ github.event.before }}"
            if [[ -n "${before_sha}" ]] && [[ "${before_sha}" != "0000000000000000000000000000000000000000" ]] && git cat-file -e "${before_sha}^{commit}" 2>/dev/null; then
              previous_package_version="$(
                git show "${before_sha}:package.json" \
                  | node -e "const fs = require('fs'); console.log(JSON.parse(fs.readFileSync(0, 'utf8')).version);"
              )"
              previous_tauri_version="$(
                git show "${before_sha}:src-tauri/tauri.conf.json" \
                  | node -e "const fs = require('fs'); console.log(JSON.parse(fs.readFileSync(0, 'utf8')).version);"
              )"

              if [[ "${previous_package_version}" == "${package_version}" ]] && [[ "${previous_tauri_version}" == "${tauri_version}" ]]; then
                should_release=false
                echo "No app version bump detected relative to ${before_sha}; skipping release."
              fi
            fi
          fi

          if [[ ! "$package_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release requires a plain X.Y.Z version (got: $package_version)." >&2
            exit 1
          fi

          platforms="${{ github.event.inputs.platforms || 'windows,linux' }}"
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            platforms="windows,linux"
          fi
          platforms_lower="$(echo "$platforms" | tr -d ' ' | tr '[:upper:]' '[:lower:]')"
          build_macos=false
          build_windows=false
          build_linux=false
          if [[ "$platforms_lower" == *"all"* ]] || [[ "$platforms_lower" == *"macos"* ]]; then
            build_macos=true
          fi
          if [[ "$platforms_lower" == *"all"* ]] || [[ "$platforms_lower" == *"windows"* ]]; then
            build_windows=true
          fi
          if [[ "$platforms_lower" == *"all"* ]] || [[ "$platforms_lower" == *"linux"* ]]; then
            build_linux=true
          fi

          release_publish="${{ github.event.inputs.publish || 'stable' }}"

          echo "Selected platforms: macos=${build_macos}, windows=${build_windows}, linux=${build_linux}"
          echo "build_macos=${build_macos}" >> "$GITHUB_OUTPUT"
          echo "build_windows=${build_windows}" >> "$GITHUB_OUTPUT"
          echo "build_linux=${build_linux}" >> "$GITHUB_OUTPUT"
          echo "package_version=${package_version}" >> "$GITHUB_OUTPUT"
          echo "should_release=${should_release}" >> "$GITHUB_OUTPUT"
          echo "release_publish=${release_publish}" >> "$GITHUB_OUTPUT"

          if [ "$should_release" = "true" ]; then
            if ! gh release view "$expected_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release create "$expected_tag" \
                --repo "$GITHUB_REPOSITORY" \
                --title "Headroom $expected_tag" \
                --notes "Release of Headroom $expected_tag." \
                --prerelease \
                --target "$GITHUB_SHA"
            fi
          fi

  windows:
    name: Windows x64
    needs: init_release
    if: needs.init_release.outputs.should_release == 'true' && needs.init_release.outputs.build_windows == 'true'
    runs-on: windows-latest
    timeout-minutes: 45

    env:
      HEADROOM_UPDATER_ENDPOINTS: '["https://github.com/${{ github.repository }}/releases/latest/download/latest.json"]'
      HEADROOM_UPDATER_STAGING_ENDPOINTS: '["https://github.com/${{ github.repository }}/releases/download/staging-rolling/latest.json"]'
      HEADROOM_UPDATER_PUBLIC_KEY: ${{ vars.HEADROOM_UPDATER_PUBLIC_KEY }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      HEADROOM_ACCOUNT_API_BASE_URL: ${{ vars.HEADROOM_ACCOUNT_API_BASE_URL }}
      HEADROOM_APTABASE_APP_KEY: ${{ vars.HEADROOM_APTABASE_APP_KEY }}
      VITE_HEADROOM_SALES_CONTACT_URL: ${{ vars.VITE_HEADROOM_SALES_CONTACT_URL }}
      VITE_HEADROOM_CONTACT_FORM_URL: ${{ vars.VITE_HEADROOM_CONTACT_FORM_URL }}
      HEADROOM_SENTRY_DSN: ${{ secrets.HEADROOM_SENTRY_DSN }}
      VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build NSIS installer
        shell: bash
        run: npx tauri build --target x86_64-pc-windows-msvc --bundles nsis

      - name: Publish Windows installer to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STABLE_TAG: v${{ needs.init_release.outputs.package_version }}
        run: |
          set -euo pipefail
          bundle_dir="src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis"
          setup="$(ls "$bundle_dir"/*-setup.exe)"
          sig="${setup}.sig"
          [ -f "$sig" ] || { echo "updater signature missing: $sig" >&2; exit 1; }

          gh release upload "$STABLE_TAG" "$setup" "$sig" --clobber --repo "$GITHUB_REPOSITORY"

  linux:
    name: Linux x86_64
    needs: init_release
    if: needs.init_release.outputs.should_release == 'true' && needs.init_release.outputs.build_linux == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    env:
      HEADROOM_UPDATER_ENDPOINTS: '["https://github.com/${{ github.repository }}/releases/latest/download/latest.json"]'
      HEADROOM_UPDATER_STAGING_ENDPOINTS: '["https://github.com/${{ github.repository }}/releases/download/staging-rolling/latest.json"]'
      HEADROOM_UPDATER_PUBLIC_KEY: ${{ vars.HEADROOM_UPDATER_PUBLIC_KEY }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      HEADROOM_ACCOUNT_API_BASE_URL: ${{ vars.HEADROOM_ACCOUNT_API_BASE_URL }}
      HEADROOM_APTABASE_APP_KEY: ${{ vars.HEADROOM_APTABASE_APP_KEY }}
      VITE_HEADROOM_SALES_CONTACT_URL: ${{ vars.VITE_HEADROOM_SALES_CONTACT_URL }}
      VITE_HEADROOM_CONTACT_FORM_URL: ${{ vars.VITE_HEADROOM_CONTACT_FORM_URL }}
      HEADROOM_SENTRY_DSN: ${{ secrets.HEADROOM_SENTRY_DSN }}
      VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            pkg-config \
            wget

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build AppImage and deb
        shell: bash
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: npx tauri build --target x86_64-unknown-linux-gnu --bundles deb,appimage

      - name: Publish Linux bundles to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STABLE_TAG: v${{ needs.init_release.outputs.package_version }}
        run: |
          set -euo pipefail
          bundle_dir="src-tauri/target/x86_64-unknown-linux-gnu/release/bundle"
          appimage="$(ls "$bundle_dir"/appimage/*.AppImage)"
          deb="$(ls "$bundle_dir"/deb/*.deb)"

          sig="$(ls "$bundle_dir"/appimage/*.sig 2>/dev/null | head -1)"
          [ -n "$sig" ] || { echo "no updater signature in $bundle_dir/appimage" >&2; exit 1; }
          updater_artifact="${sig%.sig}"
          [ -f "$updater_artifact" ] || { echo "signed artifact missing: $updater_artifact" >&2; exit 1; }

          deb_sig="$(ls "$bundle_dir"/deb/*.deb.sig 2>/dev/null | head -1)"
          [ -n "$deb_sig" ] || { echo "no updater signature in $bundle_dir/deb" >&2; exit 1; }

          assets=("$appimage" "$sig" "$deb" "$deb_sig")
          [ "$updater_artifact" = "$appimage" ] || assets+=("$updater_artifact")

          gh release upload "$STABLE_TAG" "${assets[@]}" --clobber --repo "$GITHUB_REPOSITORY"

  macos:
    name: macOS Universal
    needs: init_release
    if: needs.init_release.outputs.should_release == 'true' && needs.init_release.outputs.build_macos == 'true'
    runs-on: macos-latest
    timeout-minutes: 45

    env:
      HEADROOM_UPDATER_ENDPOINTS: '["https://github.com/${{ github.repository }}/releases/latest/download/latest.json"]'
      HEADROOM_UPDATER_STAGING_ENDPOINTS: '["https://github.com/${{ github.repository }}/releases/download/staging-rolling/latest.json"]'
      HEADROOM_UPDATER_PUBLIC_KEY: ${{ vars.HEADROOM_UPDATER_PUBLIC_KEY }}
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_PRIVATE_KEY_P8: ${{ secrets.APPLE_API_PRIVATE_KEY_P8 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      HEADROOM_ACCOUNT_API_BASE_URL: ${{ vars.HEADROOM_ACCOUNT_API_BASE_URL }}
      HEADROOM_APTABASE_APP_KEY: ${{ vars.HEADROOM_APTABASE_APP_KEY }}
      VITE_HEADROOM_SALES_CONTACT_URL: ${{ vars.VITE_HEADROOM_SALES_CONTACT_URL }}
      VITE_HEADROOM_CONTACT_FORM_URL: ${{ vars.VITE_HEADROOM_CONTACT_FORM_URL }}
      HEADROOM_SENTRY_DSN: ${{ secrets.HEADROOM_SENTRY_DSN }}
      VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and publish Tauri release
        uses: tauri-apps/tauri-action@action-v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEADROOM_UPDATER_ENDPOINTS: ${{ env.HEADROOM_UPDATER_ENDPOINTS }}
          HEADROOM_UPDATER_STAGING_ENDPOINTS: ${{ env.HEADROOM_UPDATER_STAGING_ENDPOINTS }}
          HEADROOM_UPDATER_PUBLIC_KEY: ${{ env.HEADROOM_UPDATER_PUBLIC_KEY }}
          APPLE_CERTIFICATE: ${{ env.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ env.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ env.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ env.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ env.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ env.APPLE_API_KEY_PATH }}
          APPLE_TEAM_ID: ${{ env.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ env.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ env.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: .
          tagName: v${{ needs.init_release.outputs.package_version }}
          releaseName: Headroom v${{ needs.init_release.outputs.package_version }}
          generateReleaseNotes: false
          releaseDraft: false
          prerelease: true
          assetNamePattern: '[name]_[version]_mac[ext]'
          includeUpdaterJson: true
          args: --target universal-apple-darwin

  publish:
    name: Publish manifest
    needs: [init_release, windows, linux, macos]
    if: always() && needs.init_release.result == 'success' && (needs.windows.result == 'success' || needs.windows.result == 'skipped') && (needs.linux.result == 'success' || needs.linux.result == 'skipped') && (needs.macos.result == 'success' || needs.macos.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Complete the manifest and publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STABLE_TAG: v${{ needs.init_release.outputs.package_version }}
          RELEASE_PUBLISH: ${{ needs.init_release.outputs.release_publish }}
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          gh release download "$STABLE_TAG" --repo "$GITHUB_REPOSITORY" --dir "$workdir"

          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${STABLE_TAG}"

          platforms_json="{}"

          win_sig="$(ls "$workdir"/*-setup.exe.sig 2>/dev/null | head -1 || true)"
          if [ -n "$win_sig" ]; then
            win_url="${base}/$(basename "${win_sig%.sig}")"
            platforms_json="$(jq --arg sig "$(cat "$win_sig")" --arg url "$win_url" '.["windows-x86_64"] = {signature: $sig, url: $url}' <<< "$platforms_json")"
          fi

          linux_sig="$(ls "$workdir"/*.AppImage.sig "$workdir"/*.AppImage.tar.gz.sig 2>/dev/null | head -1 || true)"
          if [ -n "$linux_sig" ]; then
            linux_url="${base}/$(basename "${linux_sig%.sig}")"
            platforms_json="$(jq --arg sig "$(cat "$linux_sig")" --arg url "$linux_url" '.["linux-x86_64"] = {signature: $sig, url: $url}' <<< "$platforms_json")"
          fi

          deb_sig="$(ls "$workdir"/*.deb.sig 2>/dev/null | head -1 || true)"
          if [ -n "$deb_sig" ]; then
            deb_url="${base}/$(basename "${deb_sig%.sig}")"
            platforms_json="$(jq --arg sig "$(cat "$deb_sig")" --arg url "$deb_url" '.["linux-x86_64-deb"] = {signature: $sig, url: $url}' <<< "$platforms_json")"
          fi

          mac_sig="$(ls "$workdir"/*_mac.app.tar.gz.sig 2>/dev/null | head -1 || true)"
          if [ -n "$mac_sig" ]; then
            mac_url="${base}/$(basename "${mac_sig%.sig}")"
            platforms_json="$(jq --arg sig "$(cat "$mac_sig")" --arg url "$mac_url" '.["darwin-aarch64"] = {signature: $sig, url: $url} | .["darwin-x86_64"] = {signature: $sig, url: $url}' <<< "$platforms_json")"
          fi

          jq -n \
            --arg version "${{ needs.init_release.outputs.package_version }}" \
            --arg notes "Headroom v${{ needs.init_release.outputs.package_version }}" \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson platforms "$platforms_json" \
            '{version: $version, notes: $notes, pub_date: $pub_date, platforms: $platforms}' \
            > "$workdir/latest.json"

          gh release upload "$STABLE_TAG" "$workdir/latest.json" --clobber --repo "$GITHUB_REPOSITORY"

          if [ "${RELEASE_PUBLISH:-stable}" = "stable" ]; then
            gh release edit "$STABLE_TAG" --repo "$GITHUB_REPOSITORY" --prerelease=false --latest
          fi

          if gh release view staging-rolling --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            for f in "$workdir"/*; do
              [ "$(basename "$f")" = "latest.json" ] && continue
              gh release upload staging-rolling "$f" --clobber --repo "$GITHUB_REPOSITORY" || true
            done
            gh release upload staging-rolling "$workdir/latest.json" --clobber --repo "$GITHUB_REPOSITORY" || true
            gh release edit staging-rolling \
              --repo "$GITHUB_REPOSITORY" \
              --title "Headroom staging (rolling)" \
              --notes "Rolling pointer to the latest build. Current: ${STABLE_TAG}." || true
          fi
